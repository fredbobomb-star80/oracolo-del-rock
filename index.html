  <!-- html2canvas per generare l'immagine -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    let player = null;
    let playerReady = false;
    let apiLoading = false;
    let apiTimer = null;
    let playbackTimer = null;
    let progressTimer = null;
    let loadedVideoId = null;
    let resumeSeconds = 0;
    let autoRecoveryUsed = false;
    let replayFinished = false;
    let currentVideoId = null;
    let lastCardForShare = null;
    let lastCardIndexForShare = null;
    let textTimer = null;

    // per la condivisione immagine
    let lastCardImageBlob = null;
    let lastCardImageUrl  = null;
    let lastCardFileName  = "oracolo-risposta-000.png";

    // FORMATTA IL TESTO STILE BIG
    function formatOracleText(testo){
      if(!testo) return "";

      const words = testo.trim().split(/\s+/);

      return words.map(word => {
        const first = word.charAt(0).toUpperCase();
        const rest  = word.slice(1);
        return `<span class="word"><span class="big-init">${first}</span>${rest}</span>`;
      }).join(" ");
    }

    // MOSTRA / NASCONDE IL TESTO NELLA CABINA
    function mostraTestoNellaCabina(testo, delayMs = 0){
      const box = document.getElementById("oracle-text");
      if(!box) return;

      if (textTimer){
        clearTimeout(textTimer);
        textTimer = null;
      }

      if(!testo){
        box.classList.remove("visible");
        box.innerHTML = "";
        return;
      }

      box.classList.remove("visible");
      box.innerHTML = "";

      textTimer = setTimeout(() => {
        box.innerHTML = formatOracleText(testo);
        requestAnimationFrame(() => box.classList.add("visible"));
        textTimer = null;
      }, delayMs);
    }

    const VIDEO_ID_PATTERN = /^[A-Za-z0-9_-]{11}$/;
    const availableCards = typeof cards !== "undefined" && Array.isArray(cards)
      ? cards.filter(c => VIDEO_ID_PATTERN.test((c.videoId || "").trim())) : [];
    const drawButton = document.getElementById("new");
    let retryCurrent = false;
    let consentPending = false;

    function marketingAllowed(){
      return !window.Cookiebot || !!window.Cookiebot.consent?.marketing;
    }

    function showVideoStatus(message, retry = true){
      if(!currentVideoId) return;
      drawButton.title = message;
      drawButton.setAttribute("aria-label", message || "Pesca la tua carta");
      retryCurrent = retry;
      drawButton.textContent = retry ? "AVVIA / RIPROVA IL BRANO" : "PESCA LA TUA CARTA";
    }

    function showCurrentText(){
      if(lastCardForShare) mostraTestoNellaCabina(lastCardForShare.text, 0);
    }

    function clearPlaybackTimer(){
      clearTimeout(playbackTimer);
      playbackTimer = null;
    }

    function rememberPosition(){
      if(!playerReady || loadedVideoId !== currentVideoId || replayFinished) return;
      try{
        const seconds = player.getCurrentTime();
        if(Number.isFinite(seconds) && seconds >= 0) resumeSeconds = seconds;
      }catch(_){}
    }

    function stopProgressWatcher(){
      clearInterval(progressTimer);
      progressTimer = null;
    }

    function startProgressWatcher(){
      stopProgressWatcher();
      let previous = resumeSeconds;
      let stalledFor = 0;
      progressTimer = setInterval(() => {
        if(document.visibilityState === "hidden") { stalledFor = 0; return; }
        if(!playerReady || loadedVideoId !== currentVideoId) return;
        rememberPosition();
        if(resumeSeconds > previous + 0.05) stalledFor = 0;
        else stalledFor += 1;
        previous = resumeSeconds;
        if(stalledFor >= 18){
          stopProgressWatcher();
          recoverInterruptedVideo();
        }
      }, 1000);
    }

    function recoverInterruptedVideo(){
      rememberPosition();
      // Una sola ripresa automatica, senza ricaricare il video o azzerare il tempo.
      // Non riprendiamo una pausa volontaria o una pagina in secondo piano.
      if(playerReady && marketingAllowed() && document.visibilityState !== "hidden" && !autoRecoveryUsed){
        let state;
        try{ state = player.getPlayerState(); }catch(_){}
        if(state === YT.PlayerState.BUFFERING || state === YT.PlayerState.PLAYING){
          autoRecoveryUsed = true;
          watchPlayback();
          try{ player.playVideo(); return; }catch(_){}
        }
      }
      videoUnavailable("La riproduzione si è interrotta. Riprova per riprendere il brano dal punto raggiunto, oppure aprilo su YouTube.");
    }

    function watchPlayback(){
      clearPlaybackTimer();
      const selectedId = currentVideoId;
      playbackTimer = setTimeout(() => {
        playbackTimer = null;
        if(currentVideoId !== selectedId) return;
        recoverInterruptedVideo();
      }, 12000);
    }

    function videoUnavailable(message){
      clearPlaybackTimer();
      stopProgressWatcher();
      rememberPosition();
      showVideoStatus(message);
      showCurrentText();
    }

    function showConsentStatus(){
      consentPending = true;
      showVideoStatus("Abilita YouTube nelle preferenze cookie oppure usa il pulsante YouTube.", false);
      drawButton.textContent = "ABILITA YOUTUBE";
      showCurrentText();
    }

    function loadYouTubeAPI(){
      if(!marketingAllowed()) { showConsentStatus(); return; }
      if(window.YT?.Player) { createPlayer(); return; }
      if(apiLoading) return;
      apiLoading = true;
      document.getElementById("youtube-api")?.remove();
      const script = document.createElement("script");
      script.id = "youtube-api";
      script.src = "https://www.youtube.com/iframe_api";
      script.onerror = () => {
        apiLoading = false;
        clearTimeout(apiTimer);
        videoUnavailable("YouTube non è raggiungibile. Riprova oppure apri il brano su YouTube.");
      };
      apiTimer = setTimeout(() => {
        apiLoading = false;
        videoUnavailable("YouTube non risponde. Riprova oppure apri il brano su YouTube.");
      }, 12000);
      document.head.appendChild(script);
    }

    window.onYouTubeIframeAPIReady = () => {
      clearTimeout(apiTimer);
      apiLoading = false;
      createPlayer();
    };

    function createPlayer(){
      if(player || !marketingAllowed()) return;
      try{
        player = new YT.Player("yt-player", {
          width: "480", height: "270",
          playerVars: { playsinline: 1, controls: 1, rel: 0, origin: location.origin },
          events: {
            onReady: onReady,
            onStateChange: onStateChange,
            onError: onPlayerError,
            onAutoplayBlocked: () => videoUnavailable("Tocca Play nel player o «Avvia / riprova il video» per ascoltare la risposta.")
          }
        });
        const frame = player.getIframe();
        frame.setAttribute("title", "Video della risposta dell’Oracolo del Rock");
        frame.setAttribute("allow", "autoplay; encrypted-media; fullscreen; picture-in-picture");
        frame.setAttribute("allowfullscreen", "");
        frame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
        clearTimeout(apiTimer);
        apiTimer = setTimeout(() => {
          if(!playerReady) videoUnavailable("Il player non risponde. Riprova oppure apri il brano su YouTube.");
        }, 12000);
      }catch(error){
        player = null;
        videoUnavailable("Impossibile caricare il player. Riprova oppure apri il brano su YouTube.");
      }
    }

    function onReady(event){
      if(!marketingAllowed()) { removePlayer(); showConsentStatus(); return; }
      playerReady = true;
      clearTimeout(apiTimer);
      if(currentVideoId){
        // Il caricamento asincrono può perdere il gesto dell'utente su Android:
        // prepariamo lo stesso brano e lasciamo un controllo Play accessibile.
        loadedVideoId = currentVideoId;
        event.target.cueVideoById({videoId: currentVideoId, startSeconds: resumeSeconds});
        showVideoStatus("Tocca Play nel player o «Avvia / riprova il video» per ascoltare la risposta.");
      }
    }

    function removePlayer(){
      rememberPosition();
      stopProgressWatcher();
      loadedVideoId = null;
      clearTimeout(apiTimer);
      clearPlaybackTimer();
      playerReady = false;
      if(player){ try{ player.destroy(); }catch(_){} }
      player = null;
      document.getElementById("yt").replaceChildren(Object.assign(document.createElement("div"), {id:"yt-player"}));
    }

    function startCurrentVideo(){
      if(!currentVideoId) return;
      if(!marketingAllowed()) { showConsentStatus(); return; }
      if(replayFinished){ resumeSeconds = 0; replayFinished = false; loadedVideoId = null; }
      autoRecoveryUsed = false;
      showVideoStatus("Caricamento del brano…");
      if(!playerReady){
        if(player) removePlayer();
        loadYouTubeAPI();
        return;
      }
      watchPlayback();
      try{
        // Chiamata sincrona nel click: conserva il gesto dell'utente.
        if(loadedVideoId === currentVideoId){
          // Play conserva la posizione; loadVideoById ricominciava da zero.
          rememberPosition();
          player.playVideo();
        }else{
          loadedVideoId = currentVideoId;
          player.loadVideoById({videoId: currentVideoId, startSeconds: resumeSeconds});
        }
      }catch(error){
        removePlayer();
        videoUnavailable("Il player si è bloccato. Riprova oppure apri il brano su YouTube.");
      }
    }

    function playRandom(){
      if(!availableCards.length) return;
      clearPlaybackTimer();
      clearTimeout(textTimer);
      const pool = availableCards.length > 1
        ? availableCards.filter(c => c.videoId.trim() !== currentVideoId) : availableCards;
      const card = pool[Math.floor(Math.random() * pool.length)] || availableCards[0];
      stopProgressWatcher();
      resumeSeconds = 0;
      autoRecoveryUsed = false;
      replayFinished = false;
      currentVideoId = card.videoId.trim();
      lastCardForShare = card;
      lastCardIndexForShare = typeof card.n === "number" ? card.n
        : typeof card.id === "number" ? card.id : cards.indexOf(card) + 1;
      document.querySelector(".social-btn.youtube").href = "https://www.youtube.com/watch?v=" + encodeURIComponent(currentVideoId);
      document.getElementById("yt").classList.replace("is-hidden", "is-visible");
      mostraTestoNellaCabina(card.text, 7000);
      startCurrentVideo();
    }

    function onStateChange(event){
      if(!currentVideoId || (event.target && event.target !== player)) return;
      if(event.data === YT.PlayerState.PLAYING){
        clearPlaybackTimer();
        replayFinished = false;
        startProgressWatcher();
        showVideoStatus("", false);
        retryCurrent = false;
        drawButton.textContent = "PESCA LA TUA CARTA";
      }else if(event.data === YT.PlayerState.BUFFERING){
        rememberPosition();
        stopProgressWatcher();
        showVideoStatus("Caricamento del brano…");
        watchPlayback();
      }else if(event.data === YT.PlayerState.PAUSED){
        rememberPosition();
        stopProgressWatcher();
        clearPlaybackTimer();
        showVideoStatus("Video in pausa: tocca Play nel player per continuare.", false);
      }else if(event.data === YT.PlayerState.ENDED){
        stopProgressWatcher();
        replayFinished = true;
        resumeSeconds = 0;
        clearPlaybackTimer();
        showVideoStatus("Puoi riascoltare la risposta oppure pescare un’altra carta.");
      }
    }

    function onPlayerError(event){
      if(event.target && event.target !== player) return;
      const messages = {
        2: "Il collegamento del video non è valido.",
        5: "Il browser non riesce a riprodurre questo video.",
        100: "Questo video non è disponibile su YouTube.",
        101: "YouTube non consente di riprodurre questo video nel sito.",
        150: "YouTube non consente di riprodurre questo video nel sito.",
        153: "YouTube non riconosce questa pagina e ha bloccato il player."
      };
      videoUnavailable((messages[event.data] || "La riproduzione si è interrotta.") + " Riprova oppure apri il brano su YouTube.");
      // Un player in errore viene ricreato al prossimo gesto, per lo stesso brano.
      removePlayer();
    }

    drawButton.addEventListener("click", () => {
      if(consentPending && !marketingAllowed()){ window.Cookiebot?.renew(); return; }
      consentPending = false;
      if(retryCurrent && currentVideoId) startCurrentVideo();
      else playRandom();
    });
    drawButton.disabled = !availableCards.length;
    if(!availableCards.length) drawButton.textContent = "CARTE NON DISPONIBILI: RICARICA LA PAGINA";
    function syncConsent(){
      if(marketingAllowed()){
        consentPending = false;
        if(currentVideoId) loadYouTubeAPI();
      }else{
        removePlayer();
        if(currentVideoId) showConsentStatus();
      }
    }
    window.addEventListener("CookiebotOnConsentReady", syncConsent);
    window.addEventListener("CookiebotOnAccept", syncConsent);
    window.addEventListener("CookiebotOnDecline", syncConsent);
    if(marketingAllowed()) loadYouTubeAPI();

    // TASTO CONDIVIDI AUDIO
    const shareAudioBtn = document.getElementById("share-audio");

    if (shareAudioBtn) {
      shareAudioBtn.addEventListener("click", async () => {

        if (!currentVideoId) {
          alert("Prima pesca la tua carta!");
          return;
        }

        const videoUrl = `https://youtu.be/${currentVideoId}`;

        if (navigator.share) {
          try {
            await navigator.share({
              title: "Ascolta il brano che mi è uscito dall'Oracolo del Rock!",
              text: "Ecco il mio responso musicale:",
              url: videoUrl
            });
            return;
          } catch (e) {
            console.log("Condivisione annullata", e);
          }
        }

        try {
          await navigator.clipboard.writeText(videoUrl);
          alert("Link copiato! Ora puoi incollarlo dove vuoi:\n\n" + videoUrl);
        } catch (e) {
          alert("Ecco il link da copiare:\n\n" + videoUrl);
        }
      });
    }

    // === FUNZIONE: genera PNG della carta usando il generatore nascosto ===
    async function generaPngCartaCondivisibile(){
      if (!lastCardForShare || !lastCardForShare.text){
        throw new Error("Nessuna carta da condividere");
      }

      const wrapper  = document.getElementById("share-card-wrapper");
      const textEl   = document.getElementById("share-card-text");
      const numEl    = document.getElementById("share-card-number");

      let n = lastCardIndexForShare;
      if (!n || isNaN(n)) n = 1;
      const padded = String(n).padStart(3,"0");
      lastCardFileName = "oracolo-risposta-" + padded + ".png";

      textEl.innerHTML = formatOracleText(lastCardForShare.text || "");
      numEl.textContent = "RISPOSTA N:" + padded;

      await new Promise(res => requestAnimationFrame(res));

      const canvas = await html2canvas(wrapper, {
        useCORS:true,
        backgroundColor:null,
        scale:2
      });

      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
          if (!blob){
            reject(new Error("Blob nullo"));
            return;
          }

          if (lastCardImageUrl){
            URL.revokeObjectURL(lastCardImageUrl);
          }

          lastCardImageBlob = blob;
          lastCardImageUrl  = URL.createObjectURL(blob);

          resolve({
            blob:lastCardImageBlob,
            url:lastCardImageUrl,
            padded
          });
        }, "image/png");
      });
    }

    // TASTO ✍️ CONDIVIDI CARTA → APRE OVERLAY
    const shareCardBtn = document.getElementById("share-card");

    if (shareCardBtn) {
      shareCardBtn.addEventListener("click", async () => {

        if (!lastCardForShare || !lastCardForShare.text) {
          alert("Prima pesca la tua carta!");
          return;
        }

        const overlay = document.getElementById("card-share-overlay");
        const preview = document.getElementById("card-share-preview");

        try{
          const { url } = await generaPngCartaCondivisibile();
          preview.src = url;
          overlay.style.display = "flex";
        }catch(e){
          console.error(e);
          alert("Errore nella generazione della carta.");
        }
      });
    }

    // chiusura overlay
    const overlayEl   = document.getElementById("card-share-overlay");
    const overlayClose= document.getElementById("card-share-close");
    if (overlayClose && overlayEl){
      overlayClose.addEventListener("click", () => {
        overlayEl.style.display = "none";
      });

      overlayEl.addEventListener("click", (e) => {
        if (e.target === overlayEl){
          overlayEl.style.display = "none";
        }
      });
    }

    // pulsante SCARICA
    const btnDownload = document.getElementById("btn-download-card");
    if (btnDownload){
      btnDownload.addEventListener("click", () => {
        if (!lastCardImageUrl){
          alert("Nessuna immagine da scaricare.");
          return;
        }
        const a = document.createElement("a");
        a.href = lastCardImageUrl;
        a.download = lastCardFileName || "oracolo-del-rock.png";
        document.body.appendChild(a);
        a.click();
        a.remove();
      });
    }

    // pulsante CONDIVIDI IMMAGINE
    const btnShareImg = document.getElementById("btn-share-card-image");
    if (btnShareImg){
      btnShareImg.addEventListener("click", async () => {
        if (!lastCardImageBlob){
          alert("Nessuna immagine da condividere.");
          return;
        }

        const file = new File(
          [lastCardImageBlob],
          lastCardFileName || "oracolo-del-rock.png",
          { type:"image/png" }
        );

        const shareData = {
          files:[file],
          title:"Chiedilo all’Oracolo del Rock",
          text:lastCardForShare?.text || "La mia carta dell'Oracolo del Rock"
        };

        if (navigator.canShare && navigator.canShare({ files:[file] })){
          try{
            await navigator.share(shareData);
          }catch(e){
            console.log("Condivisione annullata", e);
          }
        }else{
          alert("La condivisione diretta dell'immagine non è supportata su questo dispositivo. Puoi comunque usare il tasto 'Scarica' e condividerla manualmente.");
        }
      });
    }
  </script>
